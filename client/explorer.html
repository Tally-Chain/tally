<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Explorer · Tally</title>
  <link rel="canonical" href="https://tallychain.org/explorer">
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560&family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/style.css">
  <script type="importmap">
  { "imports": { "@noble/hashes/": "/vendor/hashes/", "@noble/curves/": "/vendor/curves/" } }
  </script>
</head>
<body>
  <header class="nav">
    <a class="logo" href="/"><img src="/mark.svg" width="36" height="36" alt=""> tally</a>
    <nav>
      <a href="/">Home</a><a class="on" href="/explorer">Explorer</a><a href="/wallet">Wallet</a><a href="/mine">Mine</a><a href="/docs">Docs</a><a href="/whitepaper">Whitepaper</a>
    </nav>
    <a class="btn solid desk" href="/wallet">Open wallet</a>
    <button class="burger" type="button">Menu</button>
  </header>
  <main class="wrap page">
    <div class="pagehead">
      <div><p class="cap">Every receipt is public</p><h1>Explorer</h1></div>
    </div>
    <form class="row" id="search">
      <input id="q" placeholder="block height, block hash, receipt id, or tally1 address" style="flex:1">
      <button class="btn solid" type="submit">Search</button>
    </form>
    <div id="view" style="margin-top:18px"></div>
  </main>
  <script src="/chrome.js"></script>
  <script type="module">
    import { $, api, ago, localNotch, notchOf, short, tally, toast } from '/common.js';

    function home(stats, blocks, receipts) {
      return `
        <div class="statgrid">
          <div><span>Height</span><b>${stats.height.toLocaleString('en-US')}</b></div>
          <div><span>Receipts</span><b>${stats.receipts.toLocaleString('en-US')}</b></div>
          <div><span>Difficulty</span><b>${Number(stats.difficulty).toLocaleString('en-US')}</b></div>
          <div><span>Block time</span><b>${stats.blockTime}s</b></div>
        </div>
        <div class="split2" style="margin-top:14px">
          <div class="panel"><p class="cap">Latest blocks</p><div class="list">${blocks.map((b) => `<a href="#/block/${b.height}"><span>#${b.height}</span><span>${short(b.hash, 10)}</span><span>${b.txs} tx · ${ago(b.time)}</span></a>`).join('') || '<p class="muted">Waiting for the first block.</p>'}</div></div>
          <div class="panel"><p class="cap">Receipts</p><div class="list">${receipts.map((tx) => `<a href="#/tx/${tx.id}"><span>${tx.type}</span><span>${tx.memo}</span><span>${tally(tx.amount)}</span></a>`).join('') || '<p class="muted">No receipts in a block yet.</p>'}</div></div>
        </div>`;
    }

    function txView(tx) {
      const ok = localNotch(tx);
      const notch = notchOf(tx.memo);
      if (tx.type === 'coinbase') {
        return `<div class="panel"><p class="cap">Coinbase</p><h2 style="font-size:40px">Block reward</h2><table class="kv"><tr><td>Miner</td><td><a href="#/a/${tx.to}">${tx.to}</a></td></tr><tr><td>Amount</td><td>${tally(tx.amount)}</td></tr><tr><td>Unlocks</td><td>after 3 more blocks</td></tr><tr><td>Block</td><td><a href="#/block/${tx.height}">${tx.height}</a> · ${ago(tx.time)}</td></tr></table></div>`;
      }
      return `<div class="panel">
        <div class="${ok ? 'match' : 'match no'}"><span>${ok ? 'Both halves match' : 'This receipt does not check out'}</span><span>${ok ? 'notch and signature checked here' : 'do not trust it'}</span></div>
        <div class="specimen" style="margin-top:14px">
          <div class="half"><span class="cap">Payer</span><strong style="font-size:32px">${tally(tx.amount).replace(' tTALLY','')}</strong><p>${tx.memo}</p><code>${tx.from}</code></div>
          <div class="cut"></div>
          <div class="half"><span class="cap">Payee</span><strong style="font-size:32px">${tally(tx.amount).replace(' tTALLY','')}</strong><p>${tx.memo}</p><code>${tx.to}</code></div>
        </div>
        <table class="kv">
          <tr><td>Notch</td><td>${notch}</td></tr>
          <tr><td>Mark</td><td>${tx.ref || '—'}</td></tr>
          <tr><td>Fee</td><td>${tally(tx.fee)}</td></tr>
          <tr><td>Block</td><td>${tx.height == null ? 'in mempool' : `<a href="#/block/${tx.height}">${tx.height}</a> · ${tx.confirmations} confirmations · ${ago(tx.time)}`}</td></tr>
          <tr><td>Id</td><td>${tx.id}</td></tr>
        </table>
      </div>`;
    }

    async function route() {
      const [, type, id] = location.hash.split('/');
      try {
        if (type === 'tx' && id) return $('view').innerHTML = txView(await api('/api/tx/' + id));
        if (type === 'block' && id) {
          const block = await api('/api/block/' + id);
          $('view').innerHTML = `<div class="panel"><p class="cap">Block ${block.height}</p><table class="kv"><tr><td>Hash</td><td>${block.hash}</td></tr><tr><td>Miner</td><td><a href="#/a/${block.miner}">${short(block.miner, 12)}</a></td></tr><tr><td>Time</td><td>${new Date(block.time).toISOString()} · ${ago(block.time)}</td></tr><tr><td>Difficulty</td><td>${block.diff}</td></tr></table><div class="list">${block.transactions.map((tx) => `<a href="#/tx/${tx.id}"><span>${tx.type}</span><span>${tx.memo}</span><span>${tally(tx.amount)}</span></a>`).join('')}</div></div>`;
          return;
        }
        if (type === 'a' && id) {
          const account = await api('/api/account/' + id);
          $('view').innerHTML = `<div class="panel"><p class="cap">Address</p><h2 style="font-size:28px;word-break:break-all">${account.address}</h2><p>${tally(account.balance)} spendable${BigInt(account.maturing) > 0n ? ` · ${tally(account.maturing)} maturing` : ''}</p><div class="list">${account.receipts.map((tx) => `<a href="#/tx/${tx.id}"><span>${tx.type}</span><span>${tx.memo}</span><span>${tally(tx.amount)}</span></a>`).join('') || '<p class="muted">No receipts yet.</p>'}</div></div>`;
          return;
        }
        const [stats, blocks, receipts] = await Promise.all([api('/api/stats'), api('/api/blocks?limit=12'), api('/api/receipts?limit=12')]);
        $('view').innerHTML = home(stats, blocks, receipts);
      } catch (error) {
        $('view').innerHTML = `<p class="bad">${error.message}</p>`;
      }
    }
    $('search').onsubmit = async (event) => {
      event.preventDefault();
      try {
        const found = await api('/api/search?q=' + encodeURIComponent($('q').value.trim()));
        location.hash = `#/${found.type === 'account' ? 'a' : found.type}/${found.id}`;
      } catch (error) { toast(error.message, true); }
    };
    addEventListener('hashchange', route);
    route();
    setInterval(() => { if (!location.hash || location.hash === '#/') route(); }, 6000);
  </script>
</body>
</html>
